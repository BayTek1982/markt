<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e131b">
<title>Markt · Bayazit Coin-Scanner</title>
<link rel="icon" type="image/svg+xml" href="icons/markt.svg">
<link rel="apple-touch-icon" href="icons/markt-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--line:#dde2ea;--fg:#141a24;--muted:#5d6878;--accent:#c77a12;--accent-ink:#fff;--up:#0f8a4f;--down:#c8372d;--chip:#e8ecf2;--gold:#d9951c;
  --t-dd:#a8140c;--t-d:#d4580a;--t-u:#4d8a2b;--t-uu:#22752f;
  --f-body:"Archivo",system-ui,sans-serif;--f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--panel:#151c27;--line:#253041;--fg:#e7ecf3;--muted:#8d99ab;--accent:#f0a33a;--accent-ink:#1a1206;--up:#3ccf8a;--down:#ff6b5e;--chip:#1d2633;--gold:#f0a33a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1800px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top)) calc(84px + env(safe-area-inset-bottom));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
h1{font-weight:800;font-size:1.4rem;margin:0;display:flex;gap:10px;align-items:center}
h1 .dot{width:28px;height:28px;border-radius:8px;background:var(--gold);display:inline-grid;place-items:center;color:var(--accent-ink);font-size:.95rem}
h2{font-size:1.05rem;font-weight:800;margin:0}
.sub{font-size:.8rem;color:var(--muted)}.sub a{color:var(--muted)}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{font:600 .86rem var(--f-body);border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:var(--chip);color:var(--fg);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.on{background:var(--accent);color:var(--accent-ink)}
.ico{border:0;background:var(--chip);color:var(--fg);width:38px;height:38px;border-radius:9px;font-size:1.1rem;cursor:pointer}
.ico.on{background:var(--accent);color:var(--accent-ink)}
/* Suche */
.sym{position:relative;flex:1;min-width:200px;max-width:520px}
.sym input{width:100%;font:600 1rem var(--f-body);background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:10px 12px}
.sug{position:absolute;z-index:30;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;max-height:60vh;overflow:auto;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.sug button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:10px 12px;cursor:pointer;font:500 .9rem var(--f-body)}
.sug button:last-child{border-bottom:0}.sug button:hover{background:var(--chip)}.sug b{font-family:var(--f-num)}.sug small{color:var(--muted);white-space:nowrap}
/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}}
.tile{position:relative;border:0;border-radius:6px;padding:14px 4px 12px;min-height:96px;color:#fff;background:#7a8494;cursor:pointer;display:grid;gap:1px;justify-items:center;align-content:center;font-family:var(--f-body);text-align:center;overflow:hidden}
.tile .n{font-size:.86rem;font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tile .p{font-size:1.12rem;font-weight:600;letter-spacing:-.01em}
.tile .d{font-size:.84rem}
.tile.dd{background:var(--t-dd)}.tile.d1{background:var(--t-d)}.tile.u1{background:var(--t-u)}.tile.uu{background:var(--t-uu)}
.tile .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:.9rem;line-height:24px}
.grp{margin-top:16px}.grp:first-of-type{margin-top:10px}.grp>.label{margin-bottom:6px;font-size:.78rem}
.ghead{display:flex;gap:6px;margin-bottom:6px}.ghead input{flex:1;min-width:0;font:700 .95rem var(--f-body);background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px}
.tile.ed{background:var(--accent);color:var(--accent-ink)}.tile.ed .pen{font-size:1.25rem;line-height:1.3}
.tile.add{background:none;border:2px dashed var(--line);color:var(--muted);font-size:1.7rem}
.editbar{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:8px}.editbar button{font:700 .86rem var(--f-body);letter-spacing:.03em;text-transform:uppercase;border:0;background:none;color:var(--accent);padding:10px 6px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;justify-items:center;align-items:start;padding:max(14px,env(safe-area-inset-top)) 10px 10px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;width:min(560px,100%);max-height:88vh;overflow:auto;display:grid;gap:10px}
.sheet input{width:100%;font:600 1rem var(--f-body);background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:10px 12px}
/* Listen */
.list{display:grid}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);text-align:left;cursor:pointer;font-family:var(--f-body);width:100%}
.item:last-child{border-bottom:0}
.item .n{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.74rem;color:var(--muted)}
.item .p{font:600 .92rem var(--f-num);text-align:right}
.badge{font:600 .86rem var(--f-num);padding:4px 8px;border-radius:6px;min-width:78px;text-align:right;display:inline-block;background:var(--chip)}
.badge.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}.badge.down{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:600 .82rem var(--f-body);border:0;background:var(--chip);color:var(--muted);padding:7px 11px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.two{display:grid;gap:12px}@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}
/* Detail */
.detail{display:grid;gap:12px}@media (min-width:1100px){.detail{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}.detail .wide{grid-column:1/-1}}
.nm{font-size:1.25rem;font-weight:800;line-height:1.2}
.px{font:800 2rem var(--f-body);letter-spacing:-.02em}.px small{font-size:1rem;font-weight:500;margin-left:4px}
.big.badge{font-size:1.05rem;padding:7px 10px}
.chart{position:relative;height:300px;margin-top:10px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
@media (min-width:1100px){.chart{height:440px}}
.chart canvas{display:block;width:100%;height:100%}
.tip{position:absolute;left:0;top:-6px;font:600 .76rem var(--f-num);background:var(--chip);border-radius:6px;padding:3px 7px;pointer-events:none;white-space:nowrap}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem;text-align:center;padding:20px}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.seg button{font:700 .95rem var(--f-body);border:0;background:none;color:var(--fg);padding:9px 0;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kz{display:grid;grid-template-columns:1fr;gap:0 18px;margin-top:8px}
@media (min-width:620px) and (max-width:1099px){.kz{grid-template-columns:1fr 1fr}}
.kz div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.kz span{color:var(--muted)}.kz b{font:600 .86rem var(--f-num);text-align:right}
.kz .up{color:var(--up)}.kz .down{color:var(--down)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.ext{margin-top:6px;font-size:.92rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.ext b{font:700 1.1rem var(--f-body)}.ext .up{color:var(--up)}.ext .down{color:var(--down)}
.eq{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:0 12px;margin-top:6px;font-size:.86rem}.eq>*{padding:7px 0;border-bottom:1px solid var(--line)}.eq .h{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}.eq .r{text-align:right;font-family:var(--f-num);white-space:nowrap}.eq .up{color:var(--up)}.eq .down{color:var(--down)}
/* Leiste unten */
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;max-width:220px;text-align:center;padding:9px 4px 8px;color:var(--muted);text-decoration:none;font-size:.78rem;font-weight:600;display:grid;gap:1px}
nav a i{font-style:normal;font-size:1.25rem;line-height:1.2}
nav a.on{color:var(--accent)}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:.86rem;font-weight:600;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot">↗</span>Markt</h1>
      <div class="sub"><a href="https://scanner.kompassapps.de/">Coin-Scanner</a> · <a href="https://scanner.kompassapps.de/chart.html">Chart-Bot</a> · <a href="https://scanner.kompassapps.de/golden-zone.html">Golden Zone</a></div>
    </div>
    <div class="sym">
      <input id="q" type="search" placeholder="Aktie, Index oder Coin suchen …" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Suche">
      <div class="sug" id="sug" hidden></div>
    </div>
  </header>
  <main id="view"></main>
  <div class="sub" id="foot">Aktien, Indizes und Rohstoffe: Yahoo Finance, zeitverzögert (Kurse alle 30 Min., Tagesverlauf alle 15 Min.). Krypto: Binance, live. Keine Anlageberatung.</div>
</div>
<nav>
  <a href="#uebersicht" data-v="uebersicht"><i>▦</i>Übersicht</a>
  <a href="#watchlist" data-v="watchlist"><i>☆</i>Watchlist</a>
  <a href="#tops" data-v="tops"><i>⇅</i>Tops &amp; Flops</a>
</nav>
<script>
"use strict";
const GZ="https://raw.githubusercontent.com/BayTek1982/coin-scanner/gz-data/";
const MK="https://raw.githubusercontent.com/BayTek1982/coin-scanner/markt-data/";
const BN="https://data-api.binance.vision/api/v3/";
// Indizes und Rohstoffe (Kerzen liegen im Zweig gz-data)
const IDX={"^GDAXI":["DAX","Pkt."],"^MDAXI":["MDAX","Pkt."],"^TECDAX":["TecDAX","Pkt."],"^STOXX50E":["Euro Stoxx 50","Pkt."],
  "^GSPC":["S&P 500","Pkt."],"^NDX":["Nasdaq 100","Pkt."],"^DJI":["Dow Jones","Pkt."],"^RUT":["Russell 2000","Pkt."],
  "^HSI":["Hang Seng","Pkt."],"^N225":["Nikkei 225","Pkt."],"^KS11":["KOSPI","Pkt."],
  "GC=F":["Gold","$"],"SI=F":["Silber","$"],"CL=F":["Öl (WTI)","$"],"BZ=F":["Öl (Brent)","$"],"NG=F":["Erdgas","$"],"HG=F":["Kupfer","$"],"PL=F":["Platin","$"],"PA=F":["Palladium","$"]};
const KNAME={BTC:"Bitcoin",ETH:"Ethereum",SOL:"Solana",SUI:"Sui",XRP:"XRP",BNB:"BNB",DOGE:"Dogecoin",ADA:"Cardano",TRX:"TRON",LINK:"Chainlink",AVAX:"Avalanche",XLM:"Stellar",
  HBAR:"Hedera",LTC:"Litecoin",DOT:"Polkadot",BCH:"Bitcoin Cash",SHIB:"Shiba Inu",TON:"Toncoin",UNI:"Uniswap",NEAR:"NEAR",APT:"Aptos",AAVE:"Aave",PEPE:"Pepe",ICP:"Internet Computer",
  ETC:"Ethereum Classic",ARB:"Arbitrum",OP:"Optimism",ATOM:"Cosmos",FIL:"Filecoin",INJ:"Injective",SEI:"Sei",TAO:"Bittensor",ENA:"Ethena",ONDO:"Ondo",RENDER:"Render",HYPE:"Hyperliquid",WLD:"Worldcoin",TIA:"Celestia",POL:"Polygon",ALGO:"Algorand",VET:"VeChain",FET:"Fetch.ai",JUP:"Jupiter"};
const STABLE=/^(USDC|FDUSD|TUSD|USDP|DAI|EUR|BUSD|USD1|USDE|AEUR|EURI|XUSD|BFUSD|PAXG)$/;
const CCY={"$":"USD","HK$":"HKD","¥":"JPY","₩":"KRW"};
// Themen der Marktübersicht (k = Art, damit neue Kacheln im passenden Thema landen)
const DEF_GROUPS=[{k:"krypto",n:"Krypto",t:["k:BTC","k:ETH","k:SOL","k:SUI","k:XRP","k:BNB","k:DOGE","k:ADA","k:LINK"]},
  {k:"index",n:"Indizes",t:["a:^GDAXI","a:^TECDAX","a:^STOXX50E","a:^DJI","a:^NDX","a:^GSPC","a:^MDAXI","a:^RUT","a:^N225"]},
  {k:"aktie",n:"Aktien",t:["a:NVDA","a:AAPL","a:MSFT","a:TSLA","a:AMZN","a:SAP.DE"]},
  {k:"rohstoff",n:"Rohstoffe",t:["a:GC=F","a:SI=F","a:HG=F","a:PL=F","a:PA=F","a:CL=F","a:BZ=F","a:NG=F"]}];
const cloneG=g=>g.filter(x=>x&&typeof x==="object").map(x=>({k:String(x.k||""),n:String(x.n||"Thema").slice(0,30),t:(Array.isArray(x.t)?x.t:[]).filter(id=>/^[ak]:[A-Za-z0-9.^=\-]{1,15}$/.test(id))}));
const RANGES=["1T","1W","1M","3M","1J","MAX"];

const $=id=>document.getElementById(id);
// TradingView-Symbole
const TVIDX={"^GSPC":"SP:SPX","^NDX":"NASDAQ:NDX","^DJI":"DJ:DJI","^RUT":"TVC:RUT","^GDAXI":"XETR:DAX","^MDAXI":"XETR:MDAX","^TECDAX":"XETR:TDXP","^STOXX50E":"TVC:SX5E","^HSI":"TVC:HSI","^N225":"TVC:NI225","^KS11":"TVC:KOSPI","GC=F":"COMEX:GC1!","SI=F":"COMEX:SI1!","CL=F":"NYMEX:CL1!","BZ=F":"TVC:UKOIL","NG=F":"NYMEX:NG1!","HG=F":"COMEX:HG1!","PL=F":"NYMEX:PL1!","PA=F":"NYMEX:PA1!"};
const YEX={HK:"HKEX",T:"TSE",KS:"KRX",DE:"XETR",PA:"EURONEXT",AS:"EURONEXT",BR:"EURONEXT",MI:"MIL",MC:"BME",HE:"OMXHEX",L:"LSE",SW:"SIX"};
function tvSym(m){if(m.m==="k")return"BINANCE:"+m.s+"USDT";const y=m.s;if(TVIDX[y])return TVIDX[y];const x=y.match(/^(.+)\.([A-Z]{1,2})$/);if(x&&YEX[x[2]])return YEX[x[2]]+":"+(x[2]==="HK"?x[1].replace(/^0+/,""):x[1].replace(/-/g,"_"));return y.replace(/-/g,".")}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
async function getJSON(u,ms=20000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
const fn=s=>s.replace(/[^A-Za-z0-9.\-]/g,"_");
const nf=(v,d)=>v.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const ok=v=>v!=null&&isFinite(v);
function fp(p){if(!ok(p))return"–";const a=Math.abs(p);return nf(p,a>=1?2:a>=0.01?4:a>=0.0001?6:8)}
function fpc(d){return ok(d)?(d>0?"+":"")+nf(d,2)+" %":"–"}
function big(v,cur){if(!ok(v))return null;const a=Math.abs(v),u=a>=1e12?[1e12," Bio."]:a>=1e9?[1e9," Mrd."]:a>=1e6?[1e6," Mio."]:a>=1e4?[1e3," Tsd."]:[1,""];return nf(v/u[0],u[0]===1?0:2)+u[1]+(cur?" "+cur:"")}
const cls=d=>!ok(d)?"":d>=0?"up":"down";
const p2=n=>String(n).padStart(2,"0");
const fDate=t=>{const d=new Date(t);return p2(d.getDate())+"."+p2(d.getMonth()+1)+"."};
const fDateY=t=>fDate(t)+String(new Date(t).getFullYear()).slice(2);
const fTime=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())};

// ---------- Zustand ----------
const saved=LS("bmk1")||{};
const S={groups:Array.isArray(saved.groups)&&saved.groups.length?cloneG(saved.groups):cloneG(DEF_GROUPS),ed:null,wl:Array.isArray(saved.wl)?saved.wl:["k:BTC","k:ETH","k:SOL","a:NVDA"],range:RANGES.includes(saved.range)?saved.range:"1T",tops:saved.tops||"dax",edit:false,view:"",id:null};
const save=()=>LS("bmk1",{groups:S.groups,wl:S.wl,range:S.range,tops:S.tops});
const D={A:{},RU:null,groups:{},K:{},kList:[],stand:null,kz:null,fx:null,okA:false,okK:false};

// ---------- Daten ----------
async function loadStocks(){
  const j=await getJSON("https://raw.githubusercontent.com/BayTek1982/coin-scanner/main/data/stocks.json?t="+Math.floor(Date.now()/3e5),30000);const A={};D.stand=j.updated;
  for(const[k,ix]of Object.entries(j.indices||{})){D.groups[k]=ix.name;
    for(const it of ix.items||[]){const a=A[it.y]||(A[it.y]={y:it.y,n:it.n,cur:ix.cur,g:[]});a.p=it.p;a.d=it.d;a.w=it.w;a.m=it.m;a.mc=it.mc;a.sec=it.sec;a.g.push(k)}}
  D.A=A;D.okA=true;mergeRussell()}
// Russell 2000: eigene Datei, nur Kurs + 1-Monats-Verlauf (keine Kerzen)
function mergeRussell(){const ix=D.RU;if(!ix)return;D.groups.rut=ix.name||"Russell 2000";
  for(const it of ix.items||[]){const a=D.A[it.y];if(a){if(!a.g.includes("rut"))a.g.push("rut");continue}
    D.A[it.y]={y:it.y,n:it.n,cur:ix.cur||"$",g:["rut"],p:it.p,d:it.d,w:it.w,m:it.m,mc:it.mc,sec:it.sec,spark:it.spark,rut:true}}}
async function loadRussell(){const j=await getJSON("https://raw.githubusercontent.com/BayTek1982/coin-scanner/main/data/russell.json?t="+Math.floor(Date.now()/18e5),45000);const ix=(j.indices||{}).rut;D.RU=ix?{...ix,updated:j.updated}:null;mergeRussell()}
async function loadCrypto(){
  const t=await getJSON(BN+"ticker/24hr?type=MINI");const K={};
  for(const x of t){if(!/USDT$/.test(x.symbol)||+x.closeTime<Date.now()-2*864e5)continue;const s=x.symbol.slice(0,-4);if(STABLE.test(s))continue;
    const p=+x.lastPrice,o=+x.openPrice;K[s]={s,p,d:o?(p/o-1)*100:null,h:+x.highPrice,l:+x.lowPrice,o,qv:+x.quoteVolume,day:false}}
  const list=Object.values(K).sort((a,b)=>b.qv-a.qv);
  // Wunschliste: Top 100 + Kacheln + Watchlist + geöffneter Coin
  const want=new Set(list.slice(0,100).map(k=>k.s));
  [...S.groups.flatMap(g=>g.t),...S.wl,S.id||""].forEach(id=>{if(id[0]==="k"&&K[id.slice(2)])want.add(id.slice(2))});
  const syms=[...want],tz=tzStr();
  await Promise.all(Array.from({length:Math.ceil(syms.length/100)},(_,i)=>syms.slice(i*100,i*100+100)).map(async ch=>{
    try{const j=await getJSON(BN+"ticker/tradingDay?type=MINI&timeZone="+encodeURIComponent(tz)+"&symbols="+encodeURIComponent(JSON.stringify(ch.map(x=>x+"USDT"))),12000);
